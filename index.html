<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강원대학교 도계캠퍼스 식단표</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #18202c;
      --muted: #5d6878;
      --primary: #1b5e9e;
      --primary-soft: #eaf2fa;
      --border: #dfe5ee;
      --weekend: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .wrap {
      max-width: 1040px;
      margin: 0 auto;
    }
    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .picker-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="date"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .meal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0 0 10px 0;
    }
    .menu-list {
      margin: 0;
      padding-left: 18px;
      line-height: 1.65;
    }
    .closed {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }
    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .calendar-head h2 {
      margin: 0;
      font-size: 1.1rem;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .dow {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      padding: 6px 0;
    }
    .day-cell {
      min-height: 112px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px;
      background: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.78rem;
    }
    .day-cell.empty {
      background: transparent;
      border-style: dashed;
      cursor: default;
    }
    .day-cell.weekend {
      background: var(--weekend);
    }
    .day-cell.selected {
      outline: 2px solid var(--primary);
      background: var(--primary-soft);
    }
    .day-num {
      font-weight: 700;
      font-size: 0.85rem;
    }
    .mini-meal {
      line-height: 1.3;
      color: #2c3645;
      word-break: keep-all;
    }
    .mini-label {
      font-weight: 700;
      color: var(--primary);
    }
    .hours {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>강원대학교 도계캠퍼스 식단표</h1>
        <div class="sub">도계생활관 식단 자동 연동 · 날짜 선택 시 중식·석식 즉시 확인</div>
      </div>
      <div class="picker-box">
        <input type="date" id="dateInput" value="2026-11-20" />
        <button id="todayBtn" type="button">오늘(11/20)</button>
      </div>
    </header>

    <section class="grid-2" id="selectedMealSection">
      <div class="card">
        <h2 class="meal-title">중식</h2>
        <ul class="menu-list" id="lunchList"></ul>
      </div>
      <div class="card">
        <h2 class="meal-title">석식</h2>
        <ul class="menu-list" id="dinnerList"></ul>
      </div>
    </section>

    <section class="card">
      <div class="calendar-head">
        <h2 id="calTitle">2026년 11월 식단 달력</h2>
        <span class="sub" id="selectedDateLabel">선택일: 2026-11-20 (금)</span>
      </div>
      <div class="cal-grid" id="calendarGrid"></div>
      <div class="hours">
        <strong>식당 이용 시간:</strong> 가온관·도원관 중식 12:00~13:30, 석식 17:30~19:00 / 학생식당 중식 11:30~14:00, 석식 17:30~18:30 (주말·공휴일 미운영, 물품 수급에 따라 변동 가능)
      </div>
    </section>
  </div>

  <script>
    let MEALS = {};
    const DOW = ["일", "월", "화", "수", "목", "금", "토"];
    const dateInput = document.getElementById("dateInput");
    const todayBtn = document.getElementById("todayBtn");
    const lunchList = document.getElementById("lunchList");
    const dinnerList = document.getElementById("dinnerList");
    const calendarGrid = document.getElementById("calendarGrid");
    const selectedDateLabel = document.getElementById("selectedDateLabel");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function renderMealsForDate(dateStr) {
      const meal = MEALS[dateStr];
      const d = new Date(dateStr + "T00:00:00");
      const dowText = Number.isNaN(d.getTime()) ? "" : ` (${DOW[d.getDay()]})`;
      selectedDateLabel.textContent = `선택일: ${dateStr}${dowText}`;

      if (!meal) {
        lunchList.innerHTML = `<p class="closed">등록된 식단이 없거나 주말·공휴일 미운영일이에요.</p>`;
        dinnerList.innerHTML = `<p class="closed">등록된 식단이 없거나 주말·공휴일 미운영일이에요.</p>`;
      } else {
        lunchList.innerHTML = meal.lunch.map(item => `<li>${item}</li>`).join("");
        dinnerList.innerHTML = meal.dinner.map(item => `<li>${item}</li>`).join("");
      }

      document.querySelectorAll(".day-cell").forEach(cell => {
        cell.classList.toggle("selected", cell.dataset.date === dateStr);
      });
    }

    function renderNovember2026Calendar(selectedDate) {
      calendarGrid.innerHTML = "";
      DOW.forEach(name => {
        const el = document.createElement("div");
        el.className = "dow";
        el.textContent = name;
        calendarGrid.appendChild(el);
      });

      const firstDay = new Date(2026, 10, 1).getDay();
      const daysInMonth = 30;

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day-cell empty";
        calendarGrid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `2026-11-${pad(day)}`;
        const dow = new Date(2026, 10, day).getDay();
        const cell = document.createElement("div");
        cell.className = "day-cell";
        cell.dataset.date = dateStr;
        if (dow === 0 || dow === 6) cell.classList.add("weekend");
        if (dateStr === selectedDate) cell.classList.add("selected");

        const num = document.createElement("div");
        num.className = "day-num";
        num.textContent = day;
        cell.appendChild(num);

        const data = MEALS[dateStr];
        if (data) {
          const l = document.createElement("div");
          l.className = "mini-meal";
          l.innerHTML = `<span class="mini-label">중</span> ${data.lunch.slice(0, 3).join(", ")}`;
          const dn = document.createElement("div");
          dn.className = "mini-meal";
          dn.innerHTML = `<span class="mini-label">석</span> ${data.dinner.slice(0, 3).join(", ")}`;
          cell.appendChild(l);
          cell.appendChild(dn);
        } else if (dow === 0 || dow === 6) {
          const off = document.createElement("div");
          off.className = "mini-meal";
          off.style.color = "#8894a6";
          off.textContent = "휴무";
          cell.appendChild(off);
        }

        cell.addEventListener("click", () => {
          dateInput.value = dateStr;
          renderMealsForDate(dateStr);
        });

        calendarGrid.appendChild(cell);
      }
    }

    async function loadMeals() {
      try {
        const res = await fetch("./meals.json?t=" + Date.now());
        if (!res.ok) throw new Error("meals.json 로드 실패");
        MEALS = await res.json();
      } catch (err) {
        console.error(err);
        MEALS = {};
      }
      renderNovember2026Calendar(dateInput.value);
      renderMealsForDate(dateInput.value);
    }

    dateInput.addEventListener("change", (e) => {
      renderMealsForDate(e.target.value);
    });

    todayBtn.addEventListener("click", () => {
      dateInput.value = "2026-11-20";
      renderMealsForDate("2026-11-20");
    });

    loadMeals();
  </script>
</body>
</html>
